# appId, mac.identity and publish.url are for the official Ultrawork releases.
# If you ship your own build, change all three so your app doesn't update from ours.
appId: ai.homilabs.ultrawork
productName: Ultrawork
directories:
  output: release
  buildResources: resources
asar: true
npmRebuild: false
electronLanguages:
  - en
files:
  - package.json
  - dist/main/**/*
  - "!node_modules/**/*"
extraResources:
  - from: dist/gateway/ultrawork-gateway
    to: gateway/ultrawork-gateway
  - from: drizzle
    to: drizzle
  - from: dist/renderer
    to: renderer
  - from: dist/vendor/chrome-devtools-mcp
    to: chrome-devtools-mcp
  - from: dist/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: resources/icon.icns
  identity: "HOMI AI Inc. (HQ5SZ69X2B)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
publish:
  provider: generic
  url: https://releases.ultrawork.oowa.ai/mac
